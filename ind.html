<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>My Book Tracker</h1>
        
        <!-- Optional Extra: Show counts -->
        <div class="stats" id="stats-container">
            <span id="to-read-count">0 To read</span> | 
            <span id="reading-count">0 Reading</span> | 
            <span id="finished-count">0 Finished</span>
        </div>

        <form id="book-form">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" placeholder="e.g. Aadujeevitham">
                <div class="error" id="title-error">Please enter a title</div>
            </div>
            
            <div class="form-group">
                <label for="author">Author</label>
                <input type="text" id="author" placeholder="e.g. Benyamin">
                <div class="error" id="author-error">Please enter an author</div>
            </div>
            
            <div class="form-group">
                <label for="status">Status</label>
                <select id="status">
                    <option value="To read">To read</option>
                    <option value="Reading">Reading</option>
                    <option value="Finished">Finished</option>
                </select>
            </div>
            
            <button type="submit">Add Book</button>
        </form>

        <div class="search-box">
            <input type="text" id="search" placeholder="Search by title or author...">
        </div>

        <div id="book-list" class="book-list">
            <!-- Books will be inserted here by app.js -->
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
